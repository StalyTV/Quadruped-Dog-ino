; PlatformIO Project Configuration File
;
; Each firmware is its own environment with its own source filter, so only one
; setup()/loop() is ever compiled. The old layout put three of them in src/ at
; once, which is why it could not build.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = calibrate

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor

; Bench tool. Jogs one servo at a time by pulse width and fits a per-servo
; calibration from measured joint angles. See docs/kinematics.md section 8.
[env:calibrate]
build_src_filter = +<calibrate/>

; The robot firmware goes here once the math layer exists.
; [env:walk]
; build_src_filter = +<walk/> +<math/> +<hw/>
