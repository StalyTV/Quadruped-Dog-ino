; PlatformIO Project Configuration File
;
; Each firmware is its own environment with its own source filter, so only one
; setup()/loop() is ever compiled. The old layout put three of them in src/ at
; once, which is why it could not build.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = calibrate

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
; The monitor does not echo what you type by default, so the commands below go
; out but never appear. This turns local echo on.
monitor_echo = yes
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor

build_flags = -Isrc/math

; Bench tool. Jogs one servo at a time by pulse width and fits a per-servo
; calibration from measured joint angles. See docs/kinematics.md section 8.
[env:calibrate]
build_src_filter = +<calibrate/>

; One leg tracing the gait, on a stand with the foot in the air.
[env:walk]
build_src_filter = +<walk/> +<math/>
